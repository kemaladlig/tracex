<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f0e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TraceX - Kripto & Portföy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f4f0e6;
        font-family: 'Space Mono', monospace, -apple-system, sans-serif;
        color: #1c1917;
        z-index: 99999;
        user-select: none;
        padding: 16px;
      }
      .splash-card {
        background-color: #ffffff;
        border: 2px solid #1c1917;
        box-shadow: 4px 4px 0px #1c1917;
        border-radius: 12px;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 280px;
      }
      .splash-chart {
        width: 160px;
        height: 52px;
        overflow: visible;
      }
      .splash-line {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: drawLine 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .splash-dot {
        transform-origin: 150px 14px;
        animation: pulseLiveDot 1.4s ease-in-out infinite alternate;
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 220; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseLiveDot {
        0% { transform: scale(0.7); opacity: 0.4; }
        100% { transform: scale(1.4); opacity: 1; }
      }
      .splash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: #fef08a;
        color: #1c1917;
        border: 1.5px solid #1c1917;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body class="bg-[#f4f0e6] text-stone-900 antialiased selection:bg-amber-200">
    <div id="root">
      <div id="splash-screen">
        <div class="splash-card">
          <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 22px; height: 22px; background: #1c1917; color: #f59e0b; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; border: 1.5px solid #1c1917;">
                ₿
              </div>
              <span style="font-weight: 900; font-size: 13px; letter-spacing: 0.08em;">TRACEX</span>
            </div>
            <span class="splash-badge">0MS BAŞLATILIYOR</span>
          </div>

          <!-- Animated Dynamic Bitcoin Chart Wave -->
          <svg class="splash-chart" viewBox="0 0 160 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="46" x2="160" y2="46" stroke="#e7e5e4" stroke-width="1.5" stroke-dasharray="3 3" />
            <path
              class="splash-line"
              d="M 6 42 Q 35 48 55 30 T 105 22 T 150 14"
              stroke="#1c1917"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle class="splash-dot" cx="150" cy="14" r="4.5" fill="#f59e0b" stroke="#1c1917" stroke-width="2" />
          </svg>

          <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 9px; font-weight: 700; color: #78716c;">
            <span>// PİYASA MOTORU</span>
            <span>VERİLER SENKRONİZE</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
