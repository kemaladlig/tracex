<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f0e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TraceX - Kripto & Portföy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f4f0e6;
        font-family: 'Space Mono', monospace, -apple-system, sans-serif;
        color: #1c1917;
        z-index: 99999;
        user-select: none;
        overflow: hidden;
      }
      .splash-bg-dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#1c1917 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.07;
      }
      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
        max-width: 300px;
      }
      .splash-chart {
        width: 220px;
        height: 64px;
        overflow: visible;
      }
      .splash-line {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: drawLine 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .splash-dot {
        transform-origin: 200px 18px;
        animation: pulseLiveDot 1.2s ease-in-out infinite alternate;
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseLiveDot {
        0% { transform: scale(0.6); opacity: 0.3; }
        100% { transform: scale(1.4); opacity: 1; }
      }
      .splash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: #fef08a;
        color: #1c1917;
        border: 2px solid #1c1917;
        box-shadow: 2px 2px 0px #1c1917;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body class="bg-[#f4f0e6] text-stone-900 antialiased selection:bg-amber-200">
    <div id="root">
      <div id="splash-screen">
        <div class="splash-bg-dots"></div>
        <div class="splash-content">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 28px; height: 28px; background: #1c1917; color: #f59e0b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; border: 2px solid #1c1917; box-shadow: 2px 2px 0px #1c1917;">
              ₿
            </div>
            <span style="font-weight: 900; font-size: 18px; letter-spacing: 0.1em;">TRACEX</span>
          </div>

          <!-- Full Edge-to-Edge Animated Dynamic Bitcoin Chart Wave -->
          <svg class="splash-chart" viewBox="0 0 220 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="56" x2="220" y2="56" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="4 4" />
            <path
              class="splash-line"
              d="M 10 52 Q 50 58 75 36 T 145 28 T 200 18"
              stroke="#1c1917"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle class="splash-dot" cx="200" cy="18" r="5" fill="#f59e0b" stroke="#1c1917" stroke-width="2.5" />
          </svg>

          <span class="splash-badge">0MS // BAŞLATILIYOR</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
