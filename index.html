<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f0e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TraceX - Kripto & Portföy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f4f0e6;
        font-family: 'Space Mono', monospace, -apple-system, sans-serif;
        color: #1c1917;
        z-index: 99999;
        user-select: none;
        overflow: hidden;
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .candle-bar {
        transform-box: fill-box;
        transform-origin: center;
        animation: candlePulse 1.1s ease-in-out infinite alternate;
      }
      .c-1 { animation-delay: 0.05s; }
      .c-2 { animation-delay: 0.25s; }
      .c-3 { animation-delay: 0.15s; }
      .c-4 { animation-delay: 0.35s; }
      .c-5 { animation-delay: 0.45s; }
      @keyframes candlePulse {
        0% { transform: scaleY(0.8); }
        100% { transform: scaleY(1.2); }
      }
    </style>
  </head>
  <body class="bg-[#f4f0e6] text-stone-900 antialiased selection:bg-amber-200">
    <div id="root">
      <div id="splash-screen">
        <div class="splash-content">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 28px; height: 28px; background: #1c1917; color: #f59e0b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; border: 2px solid #1c1917; box-shadow: 2px 2px 0px #1c1917;">
              ₿
            </div>
            <span style="font-weight: 900; font-size: 18px; letter-spacing: 0.12em;">TRACEX</span>
          </div>

          <!-- Sharp Geometric Japanese Candlesticks Animation -->
          <svg width="120" height="44" viewBox="0 0 120 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Candle 1: Red -->
            <line x1="14" y1="6" x2="14" y2="38" stroke="#1c1917" stroke-width="1.5" />
            <rect class="candle-bar c-1" x="9" y="16" width="10" height="14" fill="#dc2626" stroke="#1c1917" stroke-width="1.5" rx="1" />

            <!-- Candle 2: Green -->
            <line x1="38" y1="4" x2="38" y2="36" stroke="#1c1917" stroke-width="1.5" />
            <rect class="candle-bar c-2" x="33" y="14" width="10" height="16" fill="#16a34a" stroke="#1c1917" stroke-width="1.5" rx="1" />

            <!-- Candle 3: Red -->
            <line x1="62" y1="10" x2="62" y2="40" stroke="#1c1917" stroke-width="1.5" />
            <rect class="candle-bar c-3" x="57" y="18" width="10" height="12" fill="#dc2626" stroke="#1c1917" stroke-width="1.5" rx="1" />

            <!-- Candle 4: Green -->
            <line x1="86" y1="2" x2="86" y2="34" stroke="#1c1917" stroke-width="1.5" />
            <rect class="candle-bar c-4" x="81" y="10" width="10" height="18" fill="#16a34a" stroke="#1c1917" stroke-width="1.5" rx="1" />

            <!-- Candle 5: Bullish Green -->
            <line x1="110" y1="0" x2="110" y2="30" stroke="#1c1917" stroke-width="1.5" />
            <rect class="candle-bar c-5" x="105" y="4" width="10" height="20" fill="#16a34a" stroke="#1c1917" stroke-width="1.5" rx="1" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
